name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==24.2
          python -m pip install pyinstaller==6.11.1 pyinstaller-hooks-contrib==2024.10 keyboard==0.13.5 pystray==0.19.5 pillow==11.0.0

      # Release workflow step 2 (AGENTS.md): onefile, windowed, absolute paths.
      - name: Build ClaudeWowOverlay.exe
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          python -m PyInstaller --noconfirm --onefile --windowed --name ClaudeWowOverlay `
            --icon "$root\icon.ico" --specpath build --workpath build\overlay --distpath dist `
            "$root\overlay.py"

      # Step 3: refresh the payload with PowerShell Copy-Item (gotcha #9).
      - name: Refresh payload
        shell: pwsh
        run: Copy-Item -Force dist\ClaudeWowOverlay.exe payload\ClaudeWowOverlay.exe

      # Step 4: build the setup exe with the refreshed payload bundled.
      - name: Build ClaudeWowOverlaySetup.exe
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          python -m PyInstaller --noconfirm --onefile --windowed --name ClaudeWowOverlaySetup `
            --icon "$root\icon.ico" --add-data "$root\payload;payload" `
            --specpath build --workpath build\setup --distpath dist `
            "$root\installer.py"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeWowOverlaySetup
          path: dist/ClaudeWowOverlaySetup.exe
          if-no-files-found: error
